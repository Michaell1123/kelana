<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Siswa & Guru</title>

  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef2f7;
      --kartu: #ffffff;
      --teks: #14213d;
      --teks-redup: #5b667a;
      --garis: #d6dde8;
      --aksen: #1d4ed8;
      --aksen-hover: #1e40af;
      --overlay: rgba(15, 23, 42, 0.6);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1522;
        --kartu: #172033;
        --teks: #e8edf6;
        --teks-redup: #98a4ba;
        --garis: #2a3650;
        --aksen: #6c9bff;
        --aksen-hover: #3b82f6;
        --overlay: rgba(0, 0, 0, 0.75);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--teks);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
    header p  { margin: 0; color: var(--teks-redup); }

    .tombol-grup { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .btn {
      font: inherit;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-utama { background: var(--aksen); color: #fff; }
    .btn-utama:hover { background: var(--aksen-hover); }
    .btn-sekunder { background: var(--kartu); color: var(--teks); border: 1px solid var(--garis); }
    .btn-sekunder:hover { background: var(--garis); }

    /* Tab Navigasi */
    .tab-grup {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      border-bottom: 2px solid var(--garis);
    }
    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      font: inherit;
      font-weight: 600;
      color: var(--teks-redup);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.aktif {
      color: var(--aksen);
      border-bottom-color: var(--aksen);
    }

    /* Kolom pencarian dan filter */
    .kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
    .kontrol input, .kontrol select {
      font: inherit;
      color: var(--teks);
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .kontrol input  { flex: 1 1 220px; }
    .kontrol select { flex: 0 1 160px; }
    .kontrol input:focus-visible, .kontrol select:focus-visible {
      outline: 2px solid var(--aksen);
      outline-offset: 1px;
    }

    .jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }

    /* Susunan kartu */
    .daftar {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .kartu {
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 14px;
      overflow: hidden;
    }
    .pita { height: 56px; background: hsl(var(--hue) 65% 45%); }
    .isi  { padding: 0 16px 16px; text-align: center; }

    .foto {
      width: 76px; height: 76px;
      margin: -38px auto 8px;
      border-radius: 50%;
      border: 4px solid var(--kartu);
      background: hsl(var(--hue) 55% 88%);
      color: hsl(var(--hue) 65% 28%);
      display: grid; place-items: center;
      font-weight: 800; font-size: 1.5rem;
      overflow: hidden;
    }
    .foto img { width: 100%; height: 100%; object-fit: cover; }

    .nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .nis  { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }

    .rincian { margin: 0; text-align: left; font-size: 0.9rem; }
    .rincian div {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 6px 0; border-top: 1px solid var(--garis);
    }
    .rincian dt { color: var(--teks-redup); }
    .rincian dd { margin: 0; font-weight: 600; text-align: right; }

    .pesan {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--teks-redup);
    }
    .pesan.galat { color: #b42318; }
    @media (prefers-color-scheme: dark) { .pesan.galat { color: #ff8b80; } }

    /* Modal Form Popup */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-backdrop.aktif { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 16px;
      width: 100%; max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .modal h2 { margin: 0 0 16px; font-size: 1.25rem; }

    .form-grup { margin-bottom: 12px; text-align: left; }
    .form-grup label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-grup input, .form-grup select {
      width: 100%; font: inherit;
      color: var(--teks); background: var(--bg);
      border: 1px solid var(--garis); border-radius: 8px;
      padding: 8px 12px;
    }
    .modal-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>
</head>

<body>
  <div class="wadah">
    <header>
      <div>
        <h1>Data Sekolah</h1>
        <p>Direktori biodata Siswa dan Guru.</p>
      </div>
      <div class="tombol-grup">
        <button class="btn btn-utama" onclick="bukaModal('siswa')">+ Tambah Siswa</button>
        <button class="btn btn-utama" onclick="bukaModal('guru')">+ Tambah Guru</button>
      </div>
    </header>

    <!-- Navigasi Tab Siswa / Guru -->
    <div class="tab-grup">
      <button id="tabSiswa" class="tab-btn aktif" onclick="gantiTab('siswa')">Siswa</button>
      <button id="tabGuru" class="tab-btn" onclick="gantiTab('guru')">Guru</button>
    </div>

    <div class="kontrol">
      <input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP" aria-label="Cari">
      <select id="filterKategori" aria-label="Filter kategori">
        <option value="">Semua Filter</option>
      </select>
    </div>

    <p id="jumlah" class="jumlah" aria-live="polite"></p>
    <main id="daftar" class="daftar"></main>
  </div>

  <!-- Modal Form Tambah Data -->
  <div id="modalForm" class="modal-backdrop">
    <div class="modal">
      <h2 id="modalJudul">Tambah Data</h2>
      <form id="formTambah" onsubmit="simpanData(event)">
        <input type="hidden" id="tipeForm">
        
        <div class="form-grup">
          <label id="lblNomor" for="inputNomor">NIS</label>
          <input type="text" id="inputNomor" required>
        </div>
        <div class="form-grup">
          <label for="inputNama">Nama Lengkap</label>
          <input type="text" id="inputNama" required>
        </div>
        <div class="form-grup">
          <label id="lblKategori" for="inputKategori">Kelas</label>
          <input type="text" id="inputKategori" required placeholder="Contoh: X RPL 1 atau Mapel">
        </div>
        <div class="form-grup">
          <label for="inputJK">Jenis Kelamin</label>
          <select id="inputJK">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>
        <div class="form-grup">
          <label for="inputFoto">URL Foto (Opsional)</label>
          <input type="url" id="inputFoto" placeholder="https://...">
        </div>

        <div class="modal-aksi">
          <button type="button" class="btn btn-sekunder" onclick="tutupModal()">Batal</button>
          <button type="submit" id="btnSimpan" class="btn btn-utama">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://awpoaofctypyluvtrini.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__trUldB6CNLauPTKMsWN0Q_8Z_CxryS";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const elDaftar = document.getElementById("daftar");
    const elJumlah = document.getElementById("jumlah");
    const elCari = document.getElementById("cari");
    const elFilterKategori = document.getElementById("filterKategori");
    
    let tabAktif = "siswa"; // 'siswa' atau 'guru'
    let dataSiswa = [];
    let dataGuru = [];

    // ---------- AMBIL DATA ----------
    async function muatData() {
      tampilkanPesan("Memuat data...");

      // Ambil data Siswa
      const resSiswa = await db.from("siswa").select("*").order("nama");
      if (resSiswa.error) console.error("Error Siswa:", resSiswa.error);
      else dataSiswa = resSiswa.data || [];

      // Ambil data Guru (Mengambil dari tabel 'guru' jika ada)
      const resGuru = await db.from("guru").select("*").order("nama");
      if (resGuru.error) console.error("Error Guru:", resGuru.error);
      else dataGuru = resGuru.data || [];

      isiPilihanFilter();
      tampilkanData();
    }

    // ---------- SWITCH TAB ----------
    function gantiTab(tab) {
      tabAktif = tab;
      document.getElementById("tabSiswa").classList.toggle("aktif", tab === "siswa");
      document.getElementById("tabGuru").classList.toggle("aktif", tab === "guru");
      isiPilihanFilter();
      tampilkanData();
    }

    // ---------- TAMPILKAN DATA ----------
    function tampilkanData() {
      const kataKunci = elCari.value.trim().toLowerCase();
      const filterDipilih = elFilterKategori.value;
      const dataAktif = tabAktif === "siswa" ? dataSiswa : dataGuru;

      const hasil = dataAktif.filter((item) => {
        const kataNomor = item.nis || item.nip || "";
        const kataKategori = item.kelas || item.matpel || "";
        
        const cocokKategori = !filterDipilih || kataKategori === filterDipilih;
        const cocokCari = !kataKunci || 
          item.nama.toLowerCase().includes(kataKunci) || 
          kataNomor.toLowerCase().includes(kataKunci);
          
        return cocokKategori && cocokCari;
      });

      elJumlah.textContent = `${hasil.length} dari ${dataAktif.length} ${tabAktif}`;
      elDaftar.replaceChildren();

      if (hasil.length === 0) {
        tampilkanPesan(`Tidak ada data ${tabAktif} yang cocok.`);
        return;
      }

      hasil.forEach((item) => elDaftar.appendChild(buatKartu(item)));
    }

    function buatKartu(item) {
      const kartu = el("article", "kartu");
      const subJudul = item.kelas || item.matpel || "";
      const nomorID = item.nis ? "NIS " + item.nis : (item.nip ? "NIP " + item.nip : "");

      kartu.style.setProperty("--hue", warnaHash(subJudul));
      kartu.appendChild(el("div", "pita"));

      const isi = el("div", "isi");

      // Foto / Inisial
      const foto = el("div", "foto");
      if (item.foto_url) {
        const gambar = document.createElement("img");
        gambar.src = item.foto_url;
        gambar.alt = "Foto " + item.nama;
        gambar.loading = "lazy";
        gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(item.nama)));
        foto.appendChild(gambar);
      } else {
        foto.textContent = inisial(item.nama);
      }
      isi.appendChild(foto);

      isi.appendChild(el("h2", "nama", item.nama));
      if (nomorID) isi.appendChild(el("p", "nis", nomorID));

      const rincian = el("dl", "rincian");
      if (item.kelas) tambahBaris(rincian, "Kelas", item.kelas);
      if (item.matpel) tambahBaris(rincian, "Mata Pelajaran", item.matpel);
      if (item.jenis_kelamin) tambahBaris(rincian, "Jenis Kelamin", item.jenis_kelamin);
      
      isi.appendChild(rincian);
      kartu.appendChild(isi);
      return kartu;
    }

    // ---------- PROSES SIMPAN KE SUPABASE ----------
    async function simpanData(e) {
      e.preventDefault();
      const tipe = document.getElementById("tipeForm").value;
      const btn = document.getElementById("btnSimpan");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      const nama = document.getElementById("inputNama").value.trim();
      const nomor = document.getElementById("inputNomor").value.trim();
      const kat = document.getElementById("inputKategori").value.trim();
      const jk = document.getElementById("inputJK").value;
      const foto = document.getElementById("inputFoto").value.trim();

      let payload = {
        nama: nama,
        jenis_kelamin: jk,
        foto_url: foto || null
      };

      let tabel = "siswa";
      if (tipe === "siswa") {
        payload.nis = nomor;
        payload.kelas = kat;
      } else {
        tabel = "guru";
        payload.nip = nomor;
        payload.matpel = kat;
      }

      const { data, error } = await db.from(tabel).insert([payload]);

      btn.disabled = false;
      btn.textContent = "Simpan Data";

      if (error) {
        alert("Gagal menyimpan data: " + error.message);
      } else {
        tutupModal();
        muatData(); // Refresh data
      }
    }

    // ---------- MODAL CONTROL ----------
    function bukaModal(tipe) {
      document.getElementById("tipeForm").value = tipe;
      document.getElementById("modalJudul").textContent = tipe === "siswa" ? "Tambah Data Siswa" : "Tambah Data Guru";
      document.getElementById("lblNomor").textContent = tipe === "siswa" ? "NIS" : "NIP";
      document.getElementById("lblKategori").textContent = tipe === "siswa" ? "Kelas" : "Mata Pelajaran";
      document.getElementById("formTambah").reset();
      document.getElementById("modalForm").classList.add("aktif");
    }

    function tutupModal() {
      document.getElementById("modalForm").classList.remove("aktif");
    }

    // ---------- FUNGSI BANTU ----------
    function el(tag, kelas, teks) {
      const e = document.createElement(tag);
      if (kelas) e.className = kelas;
      if (teks) e.textContent = teks;
      return e;
    }

    function tambahBaris(dl, label, nilai) {
      if (!nilai) return;
      const baris = el("div");
      baris.appendChild(el("dt", "", label));
      baris.appendChild(el("dd", "", nilai));
      dl.appendChild(baris);
    }

    function inisial(nama) {
      return nama ? nama.split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("") : "";
    }

    function warnaHash(teks) {
      let total = 0;
      for (const h of teks || "") total += h.charCodeAt(0);
      return (total * 47) % 360;
    }

    function tampilkanPesan(teks) {
      elDaftar.replaceChildren(el("p", "pesan", teks));
    }

    function isiPilihanFilter() {
      elFilterKategori.innerHTML = '<option value="">Semua Filter</option>';
      const dataAktif = tabAktif === "siswa" ? dataSiswa : dataGuru;
      const kunci = tabAktif === "siswa" ? "kelas" : "matpel";
      
      const daftarKategori = [...new Set(dataAktif.map((item) => item[kunci]).filter(Boolean))].sort();
      daftarKategori.forEach((k) => {
        const opsi = el("option", "", k);
        opsi.value = k;
        elFilterKategori.appendChild(opsi);
      });
    }

    // Event Listener
    elCari.addEventListener("input", tampilkanData);
    elFilterKategori.addEventListener("change", tampilkanData);

    muatData();
  </script>
</body>
</html>
